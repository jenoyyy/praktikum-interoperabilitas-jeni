name: Project checks

on:
  push:
    branches:
      - main

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, xml, curl, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Express API integration tests
        run: npm run test:api

      - name: Build Laravel frontend assets
        run: npm run build

      - name: Check Express server syntax
        run: node --check server.js

      - name: Build Express Docker image
        run: docker build -t praktikum-http-api:test .

      - name: Run Express Docker smoke test
        run: |
          container_id=$(docker run -d -p 127.0.0.1:3000:3000 praktikum-http-api:test)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
