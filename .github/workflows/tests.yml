name: Project checks

on:
  push:
    branches:
      - main

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, xml, curl, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel API database for Postman tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: |
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force

      - name: Start Laravel API for Postman tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel-server.log 2>&1 &
          echo $! > /tmp/laravel-server.pid
          for attempt in $(seq 1 30); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/up)" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laravel-server.log
          exit 1

      - name: Run Postman collection against Laravel API
        run: npx --yes newman@6.2.1 run postman/Praktikum-Interoperabilitas-Blog-API.postman_collection.json --bail

      - name: Stop Laravel API test server
        if: always()
        run: |
          if [ -f /tmp/laravel-server.pid ]; then
            kill "$(cat /tmp/laravel-server.pid)" || true
          fi

      - name: Run Express API integration tests
        run: npm run test:api

      - name: Build Laravel frontend assets
        run: npm run build

      - name: Check Express server syntax
        run: node --check server.js

      - name: Build Express Docker image
        run: docker build -t praktikum-http-api:test .

      - name: Run Express Docker smoke test
        run: |
          container_id=$(docker run -d -p 127.0.0.1:3000:3000 praktikum-http-api:test)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
